<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Default Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
<!-- Шапка -->
<header th:replace="fragments/header :: header"></header>

<!-- Основное содержимое -->
<main class="container mt-4">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${!isAdmin}" class="alert alert-info alert-dismissible fade show mt-3 mb-4">
        <i class="bi bi-info-circle-fill me-2"></i>
        <strong>Режим просмотра:</strong> У вас есть доступ только для просмотра списка книг.
        Для добавления, редактирования или удаления книг необходимы права администратора.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Информационный блок для администратора -->
    <div th:if="${isAdmin}" class="alert alert-primary alert-dismissible fade show mt-3 mb-4">
        <i class="bi bi-shield-fill-check me-2"></i>
        <strong>Режим администратора:</strong> У вас есть полный доступ к управлению книгами,
        включая добавление, редактирование и удаление записей.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:replace="${content} :: content">
    </div>
</main>

<!-- Подвал -->
<footer th:replace="fragments/footer :: footer"></footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
