<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:fragment="content">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3 th:text="${bookForm.vendorCode == null} ? 'Добавление книги' : 'Редактирование книги'"></h3>
        </div>
        <div class="card-body">
            <!-- Решение 1: Используем th:with для вычисления URL перед формой -->
            <div th:with="actionUrl=${bookForm.vendorCode == null} ? @{/books/add} : @{/books/edit/{id}(id=${bookId})}">
                <form th:action="${actionUrl}" th:object="${bookForm}" method="post">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="vendorCode" class="form-label">Артикул</label>
                            <input type="text" class="form-control" id="vendorCode" th:field="*{vendorCode}"
                                   th:readonly="${bookForm.vendorCode != null}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('vendorCode')}" th:errors="*{vendorCode}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="title" class="form-label">Название</label>
                            <input type="text" class="form-control" id="title" th:field="*{title}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="year" class="form-label">Год издания</label>
                            <input type="number" class="form-control" id="year" th:field="*{year}" min="1800" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="brand" class="form-label">Издательство</label>
                            <input type="text" class="form-control" id="brand" th:field="*{brand}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="stock" class="form-label">Количество</label>
                            <input type="number" class="form-control" id="stock" th:field="*{stock}" min="0" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="price" class="form-label">Цена</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="price" th:field="*{price}" min="0" step="0.01" required>
                                <span class="input-group-text">₽</span>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/books}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Назад
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
