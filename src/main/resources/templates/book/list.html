<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Список книг</h2>
        <a th:if="${isAdmin}" th:href="@{/books/add}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Добавить книгу
        </a>
    </div>

    <!-- Форма фильтрации -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">Фильтр</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/books}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label for="title" class="form-label">Название</label>
                    <input type="text" class="form-control" id="title" name="title" th:value="${title}">
                </div>
                <div class="col-md-3">
                    <label for="brand" class="form-label">Издательство</label>
                    <input type="text" class="form-control" id="brand" name="brand" th:value="${brand}">
                </div>
                <div class="col-md-3">
                    <label for="year" class="form-label">Год издания</label>
                    <input type="number" class="form-control" id="year" name="year" th:value="${year}">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary me-2">Применить</button>
                    <a th:href="@{/books}" class="btn btn-secondary">Сбросить</a>
                </div>

                <!-- Скрытые поля для сохранения параметров пагинации и сортировки -->
                <input type="hidden" name="page" th:value="${currentPage}">
                <input type="hidden" name="size" th:value="${size}">
                <input type="hidden" name="sort" th:value="${sortBy + ',' + direction}">
            </form>
        </div>
    </div>

    <!-- Таблица книг -->
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Артикул</th>
                        <th>
                            <a th:href="@{/books(page=${currentPage}, size=${size}, sortBy='title', direction=${sortField == 'title' && sortDirection == 'ASC' ? 'DESC' : 'ASC'}, title=${title}, brand=${brand}, year=${year})}">
                                Название
                                <i th:if="${sortField == 'title'}" th:class="${sortDirection == 'ASC' ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up'}"></i>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/books(page=${currentPage}, size=${size}, sortBy='year', direction=${sortField == 'year' && sortDirection == 'ASC' ? 'DESC' : 'ASC'}, title=${title}, brand=${brand}, year=${year})}">
                                Год
                                <i th:if="${sortField == 'year'}" th:class="${sortDirection == 'ASC' ? 'bi bi-sort-numeric-down' : 'bi bi-sort-numeric-up'}"></i>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/books(page=${currentPage}, size=${size}, sortBy='brand', direction=${sortField == 'brand' && sortDirection == 'ASC' ? 'DESC' : 'ASC'}, title=${title}, brand=${brand}, year=${year})}">
                                Издательство
                                <i th:if="${sortField == 'brand'}" th:class="${sortDirection == 'ASC' ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up'}"></i>
                            </a>
                        </th>
                        <th>Кол-во</th>
                        <th>Цена</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}"></td>
                        <td th:text="${book.vendorCode}"></td>
                        <td th:text="${book.title}"></td>
                        <td th:text="${book.year}"></td>
                        <td th:text="${book.brand}"></td>
                        <td th:text="${book.stock}"></td>
                        <td th:text="${#numbers.formatDecimal(book.price, 1, 2)} + ' ₽'"></td>
                        <td>
                            <div class="btn-group">
                                <a th:if="${isAdmin}" th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-warning">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:if="${isAdmin}" th:action="@{/books/{id}(id=${book.id})}" method="post" style="display: inline;">
                                    <input type="hidden" name="_method" value="DELETE"/>
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('Вы уверены, что хотите удалить эту книгу?')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(books)}">
                        <td colspan="8" class="text-center">Книги не найдены</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Пагинация -->
            <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-3">
                <nav aria-label="Page navigation">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/books(page=0, size=${size}, sort=${sortField + ',' + sortDirection}, title=${title}, brand=${brand}, year=${year})}" aria-label="First">
                                <span aria-hidden="true">&laquo;&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/books(page=${currentPage - 1}, size=${size}, sort=${sortField + ',' + sortDirection}, title=${title}, brand=${brand}, year=${year})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${currentPage == i ? 'active' : ''}">
                            <a class="page-link" th:href="@{/books(page=${i}, size=${size}, sort=${sortField + ',' + sortDirection}, title=${title}, brand=${brand}, year=${year})}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/books(page=${currentPage + 1}, size=${size}, sort=${sortField + ',' + sortDirection}, title=${title}, brand=${brand}, year=${year})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/books(page=${totalPages - 1}, size=${size}, sort=${sortField + ',' + sortDirection}, title=${title}, brand=${brand}, year=${year})}" aria-label="Last">
                                <span aria-hidden="true">&raquo;&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- Информация о пагинации -->
            <div class="text-muted small text-center mt-2">
                Показано с <span th:text="${books.size() == 0 ? 0 : currentPage * size + 1}"></span>
                по <span th:text="${books.size() == 0 ? 0 : currentPage * size + books.size()}"></span>
                из <span th:text="${totalItems}"></span> книг
            </div>
        </div>
    </div>
</div>
</body>
</html>
