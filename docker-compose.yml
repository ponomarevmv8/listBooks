version: '3.8'

services:
  app:
    build: .
    container_name: list-book
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/books
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    ports:
      - "8080:8080"
    networks:
      - list-book


  postgres:
    image: postgres:15-alpine
    container_name: postgres-book
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=books
    ports:
      - "5432:5432"
    networks:
      - list-book

networks:
  list-book:
    driver: bridge